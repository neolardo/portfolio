<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Redirecting…</title>

  <!-- Instant redirect -->
  <meta http-equiv="refresh" content="0; url=https://www.facebook.com/" />

  <!-- JS redirect (backup) -->
  <script>
    window.location.replace("https://www.facebook.com/");
  </script>
</head>
<body>
  <p>Redirecting…</p>

  <!-- Fallback link -->
  <a href="https://www.facebook.com/">Click here if not redirected</a>
</body>
</html>
